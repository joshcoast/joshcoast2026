name: Deploy to Nexcess
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy wp-content to Nexcess
        run: |
          sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.NEXCESS_SSH_PASS }}" rsync -avz --delete \
            --exclude='mu-plugins/' \
            --exclude='uploads/' \
            --exclude='upgrade/' \
            --exclude='cache/' \
            --exclude='wflogs/' \
            --exclude='ai1wm-backups/' \
            --exclude='wpvividbackups/' \
            --exclude='wpvivid_staging/' \
            --exclude='jetpack-waf/' \
            --exclude='smush-webp/' \
            --exclude='settings/' \
            --exclude='debug.log*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            wp-content/ \
            a2b69fd7_1@cf9a19eaca.nxcli.io:/home/a2b69fd7/cf9a19eaca.nxcli.io/html/wp-content/