name: Deploy to Nexcess
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build coast-blocks
        run: |
          cd wp-content/plugins/coast-blocks
          npm install
          npm run build

      - name: Install and build toolbox-blocks
        run: |
          cd wp-content/plugins/toolbox-blocks
          npm install
          npm run build

      - name: Install and build jc-theme-switcher
        run: |
          cd wp-content/themes/jc-theme-switcher
          npm ci
          npm run build

      - name: Deploy wp-content to Nexcess
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass
          RSYNC_SSH_CMD="ssh -o StrictHostKeyChecking=no"
          RSYNC_PASSWORD="${{ secrets.NEXCESS_SSH_PASS }}"
          DEST="a2b69fd7_1@cf9a19eaca.nxcli.io:/home/a2b69fd7/cf9a19eaca.nxcli.io/html"

          DEPLOY_PATHS=(
            "wp-content/plugins/are-you-paying-attention/"
            "wp-content/plugins/jc-taxonomy-filter/"
            "wp-content/plugins/word-count/"
            "wp-content/plugins/wp-blog-category-filter/"
            "wp-content/plugins/coast-blocks/"
            "wp-content/plugins/toolbox-blocks/"
            "wp-content/themes/jc-theme-switcher/"
          )

          for SOURCE_PATH in "${DEPLOY_PATHS[@]}"; do
            if [ -d "$SOURCE_PATH" ]; then
              sshpass -p "$RSYNC_PASSWORD" rsync -avz --delete -e "$RSYNC_SSH_CMD" "$SOURCE_PATH" "$DEST/$SOURCE_PATH"
            else
              echo "Skipping missing path: $SOURCE_PATH"
            fi
          done
