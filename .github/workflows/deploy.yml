name: Deploy to Nexcess
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build coast-blocks
        run: |
          cd wp-content/plugins/coast-blocks
          npm install
          npm run build

      - name: Install and build toolbox-blocks
        run: |
          cd wp-content/plugins/toolbox-blocks
          npm install
          npm run build

      - name: Deploy wp-content to Nexcess
        run: |
          sudo apt-get install -y -qq sshpass
          RSYNC_CMD="sshpass -p '${{ secrets.NEXCESS_SSH_PASS }}' rsync -avz --delete -e 'ssh -o StrictHostKeyChecking=no'"
          DEST="a2b69fd7_1@cf9a19eaca.nxcli.io:/home/a2b69fd7/cf9a19eaca.nxcli.io/html"
          eval $RSYNC_CMD wp-content/themes/generatepress-child/ $DEST/wp-content/themes/generatepress-child/
          eval $RSYNC_CMD wp-content/themes/joshcoast/ $DEST/wp-content/themes/joshcoast/
          eval $RSYNC_CMD wp-content/plugins/are-you-paying-attention/ $DEST/wp-content/plugins/are-you-paying-attention/
          eval $RSYNC_CMD wp-content/plugins/jc-taxonomy-filter/ $DEST/wp-content/plugins/jc-taxonomy-filter/
          eval $RSYNC_CMD wp-content/plugins/word-count/ $DEST/wp-content/plugins/word-count/
          eval $RSYNC_CMD wp-content/plugins/wp-blog-category-filter/ $DEST/wp-content/plugins/wp-blog-category-filter/
          eval $RSYNC_CMD wp-content/plugins/coast-blocks/ $DEST/wp-content/plugins/coast-blocks/
          eval $RSYNC_CMD wp-content/plugins/toolbox-blocks/ $DEST/wp-content/plugins/toolbox-blocks/
